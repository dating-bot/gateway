  requires:
    active: true

menu:settings:
  handler: handle_settings
  requires: {}

billing:subscribe:
  handler: handle_subscribe
  requires: {}

billing:boost:
  handler: handle_boost
  requires:
    active: true

billing:cancel:
  handler: handle_cancel_sub
  requires: {}

admin:ban:{user_id}:
  handler: handle_ban
  requires:
    role: admin

admin:unban:{user_id}:
  handler: handle_unban
  requires:
    role: admin
