name: Testing

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  unit_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --locked --all-extras --all-groups

      - name: Run tests
        run: uv run pytest --numprocesses auto --cov=pechkin --junitxml=pytest.xml --cov-report=xml:coverage.xml -v

      - name: Generate diff coverage report
        if: github.event_name == 'pull_request'
        run: |
          uv run diff-cover coverage.xml \
            --compare-branch=origin/${{ github.base_ref }} \
            --markdown-report=diff-cover.md \
            --fail-under=80 || true
          cat diff-cover.md >> $GITHUB_STEP_SUMMARY

      - name: Coverage comment
        if: github.event_name == 'pull_request'
        uses: MishaKav/pytest-coverage-comment@main
        with:
          pytest-xml-coverage-path: ./coverage.xml
          junitxml-path: ./pytest.xml
          hide-report: true
          xml-skip-covered: true
          report-only-changed-files: true
          remove-links-to-files: true
          remove-links-to-lines: true
          text-instead-badge: true
